# =============================================================================
# ProxyPatient — Project Configuration
# Source: NFHS-5 India (2019-21), MoHFW/IIPS, DHS Program
# DO NOT hardcode any of these values in model or pipeline code.
# =============================================================================

project:
  name: "ProxyPatient"
  version: "2.0.0"   # v2: BP/hypertension + men's BMI from household file
  description: >
    Synthetic Patient Scenario Generation for Diabetes Risk Awareness.
    Strictly generative AI. NOT a diagnostic or clinical tool.
  outcome_label: "elevated glucose (proxy)"  # Always use this label. Never say "diabetes risk".

# -----------------------------------------------------------------------------
# RAW DATA PATHS (local only, never committed to git)
# -----------------------------------------------------------------------------
data:
  raw_dir: "raw/"
  women_file:     "raw/IAIR7EDT_extracted/IAIR7EFL.DTA"
  men_file:       "raw/IAMR7EDT_extracted/IAMR7EFL.DTA"
  household_file: "raw/IAPR7EDT_extracted/IAPR7EFL.DTA"   # v2: men's BMI + women's height
  processed_dir: "processed/"
  schema_file:    "docs/schema.json"
  aggregates_file: "docs/aggregates_v2.json"   # v2
  audit_file:     "docs/audit_results.md"
  handover_v2_dir: "handover_v2/"   # private, git-ignored

# -----------------------------------------------------------------------------
# DHS SPECIAL MISSING CODES — convert ALL of these to NaN
# Source: DHS-VII Recode Manual, Chapter on Missing Values
# -----------------------------------------------------------------------------
dhs_missing_codes:
  - 9994
  - 9995
  - 9996
  - 9997
  - 9998
  - 9999
  # Single-digit missing codes (for categorical variables)
  - 8     # don't know (some modules)
  - 9     # missing (some modules)

# BP-specific missing codes (3-digit, for readings in 0-300 mmHg range)
dhs_missing_codes_bp:
  - 994
  - 995
  - 996
  - 997
  - 998
  - 999
  - 0     # 0 = not measured for BP readings

# -----------------------------------------------------------------------------
# OUTCOME DEFINITION
# -----------------------------------------------------------------------------
outcome:
  variable_women: "sb74"       # glucose level — Women's file (confirmed in audit)
  variable_men:   "smb74"      # glucose level — Men's file (confirmed in audit)
  # DHS stores glucose in mg/dL. Verify unit with codebook before use.
  threshold_mg_dl: 200         # >= 200 mg/dL => elevated glucose (proxy)
  outcome_column: "elevated_glucose_proxy"   # name in processed dataframe
  # RULE: Glucose is NEVER a what-if conditioning input. It is ONLY the outcome.
  # RULE: Glucose is NEVER imputed. If missing, the row is excluded from outcome_stat.

# -----------------------------------------------------------------------------
# WHAT-IF CONDITIONING VARIABLES (inputs to the CVAE)
# These are the variables a user can set in the UI to define a scenario.
# -----------------------------------------------------------------------------
conditioning_variables:
  - sex
  - age_band
  - residence        # urban / rural
  - wealth_quintile
  - bmi_band
  - hypertension     # measured: systolic>=140 OR diastolic>=90 OR on BP medicine (v2)
  - tobacco          # any tobacco use
  - alcohol          # any alcohol use

# What-if option definitions (used by backend /schema endpoint and UI)
# These are the exact allowed values for each conditioning variable.
whatif_options:
  sex:
    type: binary
    options: ["0", "1"]
    labels: {0: "Female", 1: "Male"}
  age_band:
    type: categorical
    women_options: ["15-24", "25-34", "35-49"]
    men_options:   ["15-24", "25-34", "35-54"]
  residence:
    type: categorical
    options: ["urban", "rural"]
  wealth_quintile:
    type: ordinal
    options: ["1", "2", "3", "4", "5"]
    labels: {1: "Poorest", 2: "Poorer", 3: "Middle", 4: "Richer", 5: "Richest"}
  bmi_band:
    type: categorical
    options: ["underweight", "normal", "overweight", "obese"]
    note: "NaN where bmi_measured=0. Conditioning on bmi_band requires bmi_measured=1."
  hypertension:
    type: binary
    options: ["0", "1"]
    labels: {0: "Not hypertensive", 1: "Hypertensive or on BP medication"}
    definition: "systolic_avg >= 140 OR diastolic_avg >= 90 OR on_bp_medication == 1"
  tobacco:
    type: binary
    options: ["0", "1"]
    labels: {0: "No tobacco", 1: "Any tobacco use"}
  alcohol:
    type: binary
    options: ["0", "1"]
    labels: {0: "No alcohol", 1: "Drinks alcohol"}

# -----------------------------------------------------------------------------
# TRAIN / VAL / TEST SPLIT
# -----------------------------------------------------------------------------
split:
  train: 0.70
  val:   0.15
  test:  0.15
  seed:  42          # Fixed seed. Never change after splits are created.
  stratify_on: "elevated_glucose_proxy"   # stratified split on outcome

# -----------------------------------------------------------------------------
# PRIVACY & AGGREGATION RULES
# -----------------------------------------------------------------------------
privacy:
  min_cell_size: 30          # Suppress any aggregate cell with n < 30
  suppress_value: null       # Replace suppressed cells with null in JSON output
  # FORBIDDEN: Never print or commit raw rows. Never share processed splits.

# -----------------------------------------------------------------------------
# BMI ENCODING (DHS stores BMI with 2 implied decimals, e.g. 2150 = 21.50)
# -----------------------------------------------------------------------------
bmi:
  dhs_decimal_shift: 100     # divide raw value by 100 to get true BMI
  bands:
    underweight: [0, 18.5]
    normal:      [18.5, 25.0]
    overweight:  [25.0, 30.0]
    obese:       [30.0, 9999]

# -----------------------------------------------------------------------------
# AGE BANDS
# -----------------------------------------------------------------------------
age_bands:
  women: [[15,24], [25,34], [35,49]]   # Women: 15-49
  men:   [[15,24], [25,34], [35,54]]   # Men: 15-54

# -----------------------------------------------------------------------------
# SURVEY WEIGHT
# DHS stores weight as integer * 1,000,000. Divide by 1,000,000 to get the true weight.
# -----------------------------------------------------------------------------
survey_weight:
  women_col: "v005"
  men_col:   "mv005"
  divisor:   1000000

# -----------------------------------------------------------------------------
# OUTCOME STATISTIC (computed by P3 — outcome_stat function)
# -----------------------------------------------------------------------------
outcome_stat:
  bootstrap_iterations: 1000
  ci_level: 0.95
  default_cohort_size: 1000  # n to generate per scenario

# -----------------------------------------------------------------------------
# MODEL
# -----------------------------------------------------------------------------
model:
  type: "CVAE"
  latent_dim: 32
  hidden_dims: [128, 64]
  kl_annealing_epochs: 10
  seed: 42
  # ── P2 additions ──
  scope: "complete_conditions"   # glucose known AND bmi_measured==1 AND hypertension known
  beta: 1.0                      # KL weight after annealing
  lr: 0.001
  batch_size: 1024
  max_epochs: 100
  early_stopping_patience: 8     # on validation ELBO, after KL annealing
  state_embedding: true          # optional `state` condition (DHS 1-36), embedding dim below
  state_embedding_dim: 8
  min_rows_per_sex: 5000
  optional_generated: ["height_cm", "weight_kg"]
  optional_min_share: 0.8
  n_states: 36
  generate_bp: false             # true adds systolic_avg/diastolic_avg (consistent with hypertension)
  glucose_head: "mixture"        # "mixture" (K components) or "gaussian"; on log(glucose_raw)
  glucose_mixture_components: 3
  glucose_clip_mg_dl: [20, 600]  # plausibility clip for generated glucose
  # Generated variables. weight_kg is DERIVED as bmi * (height_cm/100)^2 so the three agree.
  generated_continuous: ["age", "bmi", "height_cm", "waist_cm", "hip_cm", "log_glucose"]
  generated_categorical: ["education", "bp_ever_checked"]
  # Age bands are harmonised inside the model to 15-24 / 25-34 / 35+ (35-49 women,
  # 35-54 men); either sex-specific label is accepted and the output echoes the
  # sex-appropriate one.

# -----------------------------------------------------------------------------
# FASTAPI BACKEND
# -----------------------------------------------------------------------------
api:
  host: "0.0.0.0"
  port: 8000
  endpoints:
    - GET  /health
    - GET  /schema
    - GET  /profiles
    - POST /generate
    - POST /compare
    - GET  /validation
    - POST /parse      # optional BERT parser (P3)

# -----------------------------------------------------------------------------
# EXTERNAL VALIDATION DATASET (NMB-2017)
# STALE (P2 note): no NMB-2017 data file exists in the project, so there is
# currently NO external validation. Kept for reference only.
# NEVER merge with NFHS-5. Used ONLY for external fidelity check by P3.
# DOI: 10.17632/twp8xw6p25.1 (CC0)
# -----------------------------------------------------------------------------
external_validation:
  name: "NMB-2017"
  status: "PERMANENTLY_SKIPPED"
  reason: >
    Mendeley DOI 10.17632/twp8xw6p25.1 contains only a PDF — no CSV or data file.
    Cannot be used for validation. P3 should use test_v2.parquet (held-out, 119,794 rows)
    for all fidelity and outcome validation.
  measure: "HbA1c"
  population: "high-risk Indian adults (n=7496)"
  note: >
    Different population and different glucose measure (HbA1c) from NFHS-5.
    Would have been used only for external sanity check, never merged with NFHS-5.

# -----------------------------------------------------------------------------
# BASELINES (P2): TVAE and CTGAN from the `ctgan` package
# -----------------------------------------------------------------------------
baselines:
  subsample_rows: 100000     # stratified on sex x age band x BMI band x hypertension
  epochs: 100                # ctgan default is 300; 100 keeps Colab GPU runs < ~1 h

preprocessing:
  women_height_min_share: 0.5
